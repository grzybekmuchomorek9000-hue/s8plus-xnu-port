name: dream2lte-gles

on:
  workflow_dispatch:
  push:
    branches: [s8plus-mali]
    paths:
      - .github/workflows/dream2lte-gles.yml
      - tools/dream2lte/build-gles.sh
      - tools/dream2lte/gles-layer-test.c

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          brew install meson ninja bison pkg-config
          python3 -m venv "$RUNNER_TEMP/dream2lte-venv"
          "$RUNNER_TEMP/dream2lte-venv/bin/pip" install mako pyyaml packaging setuptools meson
          echo "$RUNNER_TEMP/dream2lte-venv/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Build Mesa and the GLES layer test
        run: bash tools/dream2lte/build-gles.sh "$RUNNER_TEMP/dream2lte-mesa" out
      - uses: actions/upload-artifact@v4
        with:
          name: dream2lte-gles
          path: out/
          if-no-files-found: error
